name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

env:
  # 捆绑的内置 DSH 版本（npm 包 @deepseek-ai/dsh）
  DSH_VERSION: "0.1.1-rc.2"
  # 捆绑的 Node.js 运行时版本（win-x64）
  NODE_VERSION: "22.21.1"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (build tooling)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Node.js runtime (bundled into installer)
        shell: pwsh
        run: |
          $ver = "${{ env.NODE_VERSION }}"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-x64
          New-Item -ItemType Directory -Force -Path src-tauri/resources/node | Out-Null
          Copy-Item "node-x64/node-v$ver-win-x64/node.exe" "src-tauri/resources/node/node.exe"
          Get-Item "src-tauri/resources/node/node.exe" | Select-Object Name, Length

      - name: Install DSH package (bundled, Windows natives)
        shell: pwsh
        run: |
          $ver = "${{ env.DSH_VERSION }}"
          New-Item -ItemType Directory -Force -Path src-tauri/resources/dsh | Out-Null
          # 用 npm overrides 把 web 渲染链子包钉到与主包同一版本，
          # 防止 npm 按 ^ 范围浮升子包，导致 dsh-host-frontend-static 调用的
          # renderIndex 与 dsh-host-webserver 提供的 applyIndexTaps 错位。
          $overrides = @{
            "@deepseek-ai/dsh-host-frontend-static" = $ver
            "@deepseek-ai/dsh-host-webserver"       = $ver
            "@deepseek-ai/dsh-web-app"              = $ver
            "@deepseek-ai/dsh-web-frontend"         = $ver
            "@deepseek-ai/dsh-web"                  = $ver
          }
          @{
            name      = "dsh-bundled"
            private   = $true
            overrides = $overrides
          } | ConvertTo-Json -Depth 5 | Set-Content -Path src-tauri/resources/dsh/package.json
          Push-Location src-tauri/resources/dsh
          npm install --no-audit --no-fund --save-exact "@deepseek-ai/dsh@$ver"
          # 校验：渲染链子包必须与主包同版本，不一致直接让构建失败
          $main = (Get-Content "node_modules/@deepseek-ai/dsh/package.json" -Raw | ConvertFrom-Json).version
          foreach ($p in @("dsh-host-frontend-static", "dsh-host-webserver", "dsh-web-app")) {
            $v = (Get-Content "node_modules/@deepseek-ai/$p/package.json" -Raw | ConvertFrom-Json).version
            if ($v -ne $main) { Write-Error "@deepseek-ai/$p=$v 与 dsh=$main 版本不一致"; exit 1 }
            Write-Host "  ok @deepseek-ai/$p = $v"
          }
          Pop-Location
          Get-Item "src-tauri/resources/dsh/node_modules/@deepseek-ai/dsh/package.json" | Select-Object FullName

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle (Tauri, embeds Node + DSH)
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
