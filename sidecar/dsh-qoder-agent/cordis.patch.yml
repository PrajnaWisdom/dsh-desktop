# dsh-qoder-agent bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field).
#
# The node half (exports ".") runs in the host process (Qoder model provider
# configuration + /api/qoder-agent routes); the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) mount a theme-aware settings section.
#
# `id` is stable so the user's own ~/.dsh/cordis.patch.yml can toggle this row;
# `name` is the published package name and must match package.json.
- insert:
    - id: ui-dsh-qoder-agent
      name: '@dsh-desktop/dsh-qoder-agent'
