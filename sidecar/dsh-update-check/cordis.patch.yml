# dsh-update-check bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (reads the installed dsh version + queries the npm registry
# through /api/dsh-update-check/check), and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI settings page.
#
# `id` is stable so the user's own ~/.dsh/cordis.patch.yml can toggle this row;
# `name` is the published package name and must match package.json.
- insert:
    - id: ui-dsh-update-check
      name: '@dsh-desktop/dsh-update-check'
