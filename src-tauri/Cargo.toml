[package]
name = "dsh-desktop"
version = "0.4.22"
description = "DSH Desktop 鈥?鍐呭祵 DSH Web GUI 鐨?Windows 妗岄潰瀹㈡埛绔?
authors = ["DSH Desktop Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
